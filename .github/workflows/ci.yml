name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  rust:
    name: rust (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Instalar dependências de sistema do Tauri (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev
      # rustup instala o toolchain pinado em rust-toolchain.toml
      # (canal + rustfmt/clippy) na primeira invocação do cargo

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # tauri::generate_context! exige que o frontendDist (../build) exista
      - name: Criar frontendDist vazio
        run: mkdir -p build

      # bundle.resources de tauri.windows.conf.json (T067) exige que os
      # paths existam em TODO cargo build/check/clippy/test no Windows, não
      # só ao empacotar o instalador de verdade — stub evita baixar
      # adb/ffmpeg (~150 MB) só pra compilar/testar.
      - name: Vendorizar binários (stub, Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./installer/windows/vendor.ps1 -Stub

      # Mesmo motivo no Linux: bundle.resources de tauri.linux.conf.json
      # (T066) aponta pro jar do fork em installer/linux/vendor/, que é
      # gitignored — sem o stub, build.rs falha antes de qualquer lint/teste.
      - name: Vendorizar binários (stub, Linux)
        if: runner.os == 'Linux'
        run: ./installer/linux/vendor.sh --stub

      - name: cargo fmt --check
        working-directory: src-tauri
        run: cargo fmt --check

      - name: cargo clippy -D warnings
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: cargo test
        working-directory: src-tauri
        run: cargo test
