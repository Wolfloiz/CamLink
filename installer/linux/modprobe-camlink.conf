# CamLink (T066) — parâmetros do v4l2loopback (/etc/modprobe.d/).
#
# `devices=0`: carregar o módulo NÃO deve criar nenhum device. Sem isto o
# default do módulo é 1 device, que apareceria como webcam vazia
# permanente. Cada fonte do CamLink cria o seu com `-x 1`
# (exclusive_caps por device, exigido por Chrome/WebRTC e OBS — research R3),
# então também não há `exclusive_caps` global aqui.
options v4l2loopback devices=0
