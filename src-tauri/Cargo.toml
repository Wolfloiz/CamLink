[package]
name = "camlink"
version = "0.1.0"
description = "Câmeras Android e IP como webcams virtuais (Linux + Windows)"
license = "GPL-3.0"
edition = "2021"
# `fake_backend` (tests/bin, T018) criou um segundo [[bin]] no crate; sem
# isso, `cargo run`/`cargo tauri dev` fica ambíguo sobre qual rodar.
default-run = "camlink"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

# Sem isso o tauri-build nunca vê a feature `custom-protocol` ativa e trata
# TODO build (inclusive release) como dev — sempre tentando carregar
# `devUrl` (http://localhost:1420) em vez do frontend embutido. `tauri dev`
# roda com `--no-default-features` (desliga isso de propósito); `tauri
# build`/`cargo build --release` usam o default.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "camlink_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Loops de pixel (RGBA→RGB, encode JPEG do crate `image`) em opt-level 0 são
# ordens de grandeza mais lentos e distorcem qualquer avaliação de fluidez em
# `cargo tauri dev`. Deps sobem para 3 (é onde mora o custo); nosso código fica
# em 1 para manter compile rápido. Avaliação de performance vale só em release.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "sync", "time", "io-util", "net", "fs", "signal"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
toml = "0.8"
dirs = "6"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
base64 = "0.22"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service"] }

[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
libloading = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_LibraryLoader",
    "Win32_System_Ole",
    "Win32_System_Registry",
    "Win32_System_Variant",
    "Win32_Media",
    "Win32_Media_MediaFoundation",
    "Win32_Media_DirectShow",
    "Win32_Media_KernelStreaming",
    "Win32_Graphics_Gdi",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Memory",
    "Win32_System_Threading",
] }
windows-core = "0.62"

[[example]]
name = "win_dshow_spike"
crate-type = ["cdylib"]

[[bin]]
name = "fake_backend"
path = "tests/bin/fake_backend.rs"
test = false
doc = false

