name: Release

# Dispara ao empurrar uma tag `vX.Y.Z`. A release sai como RASCUNHO: os
# artefatos ficam anexados para conferência e a publicação é um clique
# manual — nenhuma instalação limpa foi validada automaticamente aqui (o
# T071 continua sendo bancada).
on:
  push:
    tags: ["v*"]
  # Permite exercitar o pipeline inteiro sem criar tag (não publica nada).
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  versao:
    name: tag bate com a versão do app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Evita publicar um pacote v0.2.0 que por dentro se chama 0.1.0 — o
      # bundler usa a versão do tauri.conf.json para nomear os arquivos.
      - name: Conferir versão
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          app=$(python3 -c "import json;print(json.load(open('src-tauri/tauri.conf.json'))['version'])")
          tag="${GITHUB_REF_NAME#v}"
          echo "tauri.conf.json=$app  tag=$tag"
          if [ "$app" != "$tag" ]; then
            echo "::error::a tag ($tag) não bate com a versão do app ($app)"
            exit 1
          fi

  jar:
    name: scrcpy-server-camlink (fork Android)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # O runner já traz o Android SDK, mas não necessariamente a plataforma
      # que o fork compila (compileSdk = 36).
      # O caminho do sdkmanager varia entre imagens de runner
      # (cmdline-tools/latest vs. cmdline-tools/<versão>), então é localizado
      # em vez de assumido.
      - name: Instalar plataforma Android 36
        run: |
          sdkmanager=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | sort | tail -1)
          if [ -z "$sdkmanager" ]; then
            echo "::error::sdkmanager não encontrado em $ANDROID_HOME/cmdline-tools"
            exit 1
          fi
          echo "usando $sdkmanager"
          yes | "$sdkmanager" "platforms;android-36" > /dev/null

      # build-camlink.sh roda os testes de protocolo contra os golden files
      # antes de empacotar; falha de teste aborta o build.
      - name: Build do jar
        working-directory: scrcpy
        run: ./build-camlink.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: scrcpy-server-camlink
          path: scrcpy/dist/scrcpy-server-camlink*
          if-no-files-found: error

  linux:
    name: pacotes Linux (.deb + AppImage)
    needs: [versao, jar]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Dependências de sistema do Tauri
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev libssl-dev

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      # O jar vem do job anterior: aqui não há JDK nem Android SDK.
      - uses: actions/download-artifact@v4
        with:
          name: scrcpy-server-camlink
          path: scrcpy/dist

      # Binários reais (adb + ffmpeg para o AppImage, jar para os dois).
      # Sem `--stub`: isto é release, não compilação de CI.
      - name: Vendorizar binários
        run: ./installer/linux/vendor.sh

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles deb,appimage

      - uses: actions/upload-artifact@v4
        with:
          name: pacotes-linux
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows:
    name: instaladores Windows (NSIS + MSI)
    needs: [versao, jar]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      - run: npm install -g pnpm

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - uses: actions/download-artifact@v4
        with:
          name: scrcpy-server-camlink
          path: scrcpy/dist

      # Baixa adb + ffmpeg reais e copia o jar. Também cria o placeholder de
      # camlink_lib.dll, que o build.rs exige existir antes do cargo produzir
      # o DLL de verdade — o bundler pega o real, que já existe na hora de
      # empacotar.
      - name: Vendorizar binários
        shell: pwsh
        run: ./installer/windows/vendor.ps1

      - run: pnpm install --frozen-lockfile
      - run: pnpm tauri build --bundles nsis,msi

      - uses: actions/upload-artifact@v4
        with:
          name: instaladores-windows
          if-no-files-found: error
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi

  release:
    name: rascunho da release
    needs: [linux, windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v4
        with:
          path: artefatos

      # O jar entra como asset por si só: o PKGBUILD do AUR baixa dele
      # (`releases/download/vX.Y.Z/scrcpy-server-camlink`) em vez de exigir
      # JDK + Android SDK na máquina de quem instala.
      - name: Listar artefatos
        run: find artefatos -type f | sort

      - name: Criar rascunho da release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > notas.md <<'NOTAS'
          Veja o [CHANGELOG](../../blob/main/CHANGELOG.md) para o que entrou
          nesta versão.

          > **Rascunho gerado automaticamente.** Confira os artefatos e valide
          > a instalação limpa antes de publicar — o workflow compila e
          > empacota, mas não instala nada.
          NOTAS

          # Array em vez de expansão solta: nome de arquivo com espaço viraria
          # dois argumentos e o upload subiria errado.
          mapfile -t artefatos < <(find artefatos -type f | sort)
          printf '  %s\n' "${artefatos[@]}"

          gh release create "$GITHUB_REF_NAME" \
            --draft \
            --title "CamLink $GITHUB_REF_NAME" \
            --notes-file notas.md \
            "${artefatos[@]}"
