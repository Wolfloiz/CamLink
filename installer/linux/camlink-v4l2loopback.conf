# CamLink (T066) — carrega o v4l2loopback no boot (/etc/modules-load.d/).
#
# Só carrega o módulo: os devices são criados sob demanda pelo app
# (`v4l2loopback-ctl add -n "<label>" -x 1`, um por fonte, ver
# virtualcam/v4l2.rs). Nada de `video_nr`/`card_label` fixos aqui — device
# pré-criado colidiria com a alocação dinâmica e apareceria como webcam
# fantasma no OBS/Chrome mesmo com o CamLink fechado.
v4l2loopback
